name: Deploy chapchu-auth

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/chapchu-auth:latest

      - name: Copy k8s manifests to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "k8s/"
          target: "~/k8s/chapchu-auth"

      - name: Apply k8s secrets
        uses: appleboy/ssh-action@v1
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH_RSA_PRIVATE_KEY: ${{ secrets.AUTH_RSA_PRIVATE_KEY }}
          AUTH_RSA_PUBLIC_KEY: ${{ secrets.AUTH_RSA_PUBLIC_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,DB_URL,DB_USERNAME,DB_PASSWORD,AUTH_RSA_PRIVATE_KEY,AUTH_RSA_PUBLIC_KEY
          script: |
            export KUBECONFIG=/home/ubuntu/.kube/config
            kubectl create secret generic chapchu-auth-secret \
              --from-literal=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
              --from-literal=GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
              --from-literal=DB_URL="$DB_URL" \
              --from-literal=DB_USERNAME="$DB_USERNAME" \
              --from-literal=DB_PASSWORD="$DB_PASSWORD" \
              --from-literal=AUTH_RSA_PRIVATE_KEY="$AUTH_RSA_PRIVATE_KEY" \
              --from-literal=AUTH_RSA_PUBLIC_KEY="$AUTH_RSA_PUBLIC_KEY" \
              -n chapchu --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            export KUBECONFIG=/home/ubuntu/.kube/config
            # 시크릿은 위 "Apply k8s secrets" 스텝에서만 관리한다.
            # 디렉터리 전체(-f k8s/) 적용은 예시 매니페스트가 실제 시크릿을 REPLACE_ME 로 덮어쓰므로 금지.
            # 이전 배포로 서버에 남아있을 수 있는 stale 예시 파일 정리.
            rm -f ~/k8s/chapchu-auth/k8s/secret.example.yaml
            kubectl apply -f ~/k8s/chapchu-auth/k8s/namespace.yaml
            kubectl apply -f ~/k8s/chapchu-auth/k8s/configmap.yaml
            kubectl apply -f ~/k8s/chapchu-auth/k8s/service.yaml
            kubectl apply -f ~/k8s/chapchu-auth/k8s/deployment.yaml
            kubectl rollout restart deployment/chapchu-auth -n chapchu
            kubectl rollout status deployment/chapchu-auth -n chapchu --timeout=4m
