apiVersion: v1
kind: ConfigMap
metadata:
  name: chapchu-auth-config
  namespace: chapchu
data:
  AUTH_SERVER_URL: "https://auth.chapchu.site"
  GOOGLE_REDIRECT_URI: "https://auth.chapchu.site/login/oauth2/code/google"
  # 쉼표로 구분해 여러 개 등록할 수 있다. 여기 없는 redirect_uri로 인가 요청이 오면
  # 에러 없이 구글 로그인으로 넘어간 뒤 아무 데도 도달하지 못하므로, 쓰는 주소는 빠짐없이 넣어야 한다.
  # 프론트 배포 주소가 생기면 쉼표로 추가하라.
  # 로컬 FE 개발 시 localhost:3000/login/callback 으로도 콜백을 받을 수 있도록 쉼표로 추가
  FRONT_REDIRECT_URI: "https://api.chapchu.site/docs/test-login.html,http://localhost:3000/login/callback"
  # 신규 유저 온보딩 페이지 URL. registration_token 파라미터와 함께 리다이렉트된다.
  # FE가 배포되면 해당 온보딩 경로로 교체하라.
  FRONT_ONBOARDING_URI: "https://api.chapchu.site/docs/test-login.html,http://localhost:3000/onboarding"
  # Cloudflare가 TLS를 종료하므로 브라우저 구간은 HTTPS다. 세션 쿠키에 Secure를 붙인다.
  SESSION_COOKIE_SECURE: "true"
