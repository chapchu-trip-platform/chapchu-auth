apiVersion: v1
kind: ConfigMap
metadata:
  name: chapchu-auth-config
  namespace: chapchu
data:
  AUTH_SERVER_URL: "https://auth.chapchu.site"
  GOOGLE_REDIRECT_URI: "https://auth.chapchu.site/login/oauth2/code/google"
  # Cloudflare가 TLS를 종료하므로 브라우저 구간은 HTTPS다. 세션 쿠키에 Secure를 붙인다.
  SESSION_COOKIE_SECURE: "true"
  # FRONT_REDIRECT_URI, FRONT_ONBOARDING_URI는 GitHub Variables로 관리한다.
  # chapchu-auth 레포 → Settings → Variables에서 변경하면 다음 배포 시 자동 반영된다.
  FE_REDIRECT_URL: "https://{FE도메인}/auth/oauth"
  CORS_ALLOWED_ORIGINS: "https://{FE도메인},http://localhost:3000"
