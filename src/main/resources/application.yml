spring:
  application:
    name: chapchu-auth

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            redirect-uri: "${GOOGLE_REDIRECT_URI:http://localhost:9000/login/oauth2/code/google}"

# chapchu-api의 spring.security.oauth2.resourceserver.jwt.issuer-uri와 동일한 값을 가리켜야 한다.
# (docs/decisions/008-auth-server-separation.md 참고)
chapchu-auth:
  issuer-uri: ${AUTH_SERVER_URL}
  client:
    front-redirect-uri: ${FRONT_REDIRECT_URI:http://localhost:3000/login/callback}
  jwt:
    rsa-private-key: ${AUTH_RSA_PRIVATE_KEY:}
    rsa-public-key: ${AUTH_RSA_PUBLIC_KEY:}

server:
  port: 9000
  forward-headers-strategy: FRAMEWORK
  servlet:
    session:
      cookie:
        # Cloudflare가 TLS를 종료하고 origin 구간은 평문이라, Tomcat은 요청을 http로 보고
        # Secure를 붙이지 않는다. 브라우저-Cloudflare 구간은 HTTPS이므로 운영에서는 켜야 한다.
        # 로컬(http)에서 켜면 쿠키가 전송되지 않아 로그인이 되지 않으므로 기본값은 false다.
        secure: ${SESSION_COOKIE_SECURE:false}
        # OAuth 콜백은 최상위 GET 이동이라 Lax로도 쿠키가 전달된다. Strict는 흐름을 깨뜨린다.
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
